[project]
name = "morning-report-worker"
version = "0.1.0"
description = "Daily 05:00 Europe/Helsinki morning report: Kuopio weather + top US news of the last 12 hours"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.28",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
